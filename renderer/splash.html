<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #06070d;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      height: 100vh; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #f0f1f6; overflow: hidden;
      -webkit-app-region: drag;
      position: relative;
    }

    /* ── Particle canvas ── */
    canvas {
      position: absolute; inset: 0;
      pointer-events: none;
    }

    /* ── Glow rings ── */
    .rings {
      position: absolute;
      width: 300px; height: 300px;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
    .ring {
      position: absolute; inset: 0;
      border-radius: 50%;
      border: 1px solid rgba(88,101,242,0.15);
      animation: ringPulse 3s ease-in-out infinite;
    }
    .ring:nth-child(1) { animation-delay: 0s; }
    .ring:nth-child(2) { transform: scale(0.72); animation-delay: 0.6s; border-color: rgba(155,89,182,0.15); }
    .ring:nth-child(3) { transform: scale(0.45); animation-delay: 1.2s; border-color: rgba(88,101,242,0.1); }
    @keyframes ringPulse {
      0%,100% { opacity: 0.5; transform: scale(var(--s,1)); }
      50% { opacity: 1; transform: scale(calc(var(--s,1) * 1.05)); }
    }
    .ring:nth-child(1) { --s: 1; }
    .ring:nth-child(2) { --s: 0.72; }
    .ring:nth-child(3) { --s: 0.45; }

    /* ── Central glow blob ── */
    .glow-blob {
      position: absolute;
      width: 220px; height: 220px;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(88,101,242,0.12) 0%, transparent 70%);
      border-radius: 50%;
      animation: blobPulse 2.5s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes blobPulse {
      0%,100% { opacity: 0.6; transform: translate(-50%,-50%) scale(1); }
      50%      { opacity: 1;   transform: translate(-50%,-50%) scale(1.15); }
    }

    /* ── Content ── */
    .content {
      position: relative; z-index: 10;
      display: flex; flex-direction: column;
      align-items: center;
      animation: contentIn 0.7s ease forwards;
      opacity: 0;
    }
    @keyframes contentIn {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Logo ── */
    .logo-wrap {
      position: relative;
      width: 72px; height: 72px;
      margin-bottom: 22px;
    }
    .logo-bg {
      position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(88,101,242,0.25), rgba(155,89,182,0.25));
      border: 1px solid rgba(88,101,242,0.3);
      border-radius: 22px;
      animation: logoBgGlow 2s ease-in-out infinite;
    }
    @keyframes logoBgGlow {
      0%,100% { box-shadow: 0 0 20px rgba(88,101,242,0.2), 0 0 40px rgba(88,101,242,0.1); }
      50%      { box-shadow: 0 0 30px rgba(88,101,242,0.4), 0 0 60px rgba(155,89,182,0.2); }
    }
    .logo-svg {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .logo-svg svg {
      animation: logoFloat 3s ease-in-out infinite;
      filter: drop-shadow(0 0 8px rgba(88,101,242,0.6));
    }
    @keyframes logoFloat {
      0%,100% { transform: translateY(0); }
      50%      { transform: translateY(-3px); }
    }

    /* ── Text ── */
    h1 {
      font-size: 17px; font-weight: 700;
      letter-spacing: -0.4px; margin-bottom: 6px;
      background: linear-gradient(135deg, #e8e9f3 30%, #8b8fa8 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    h1 .pro {
      background: linear-gradient(135deg, #5865f2, #9b59b6);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .tagline {
      font-size: 11px; color: #4a4f68; margin-bottom: 32px;
      letter-spacing: 0.3px;
    }

    /* ── Progress dots ── */
    .dots {
      display: flex; gap: 7px; margin-bottom: 10px;
    }
    .dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: rgba(88,101,242,0.25);
      animation: dotAnim 1.4s ease-in-out infinite;
    }
    .dot:nth-child(1) { animation-delay: 0s; }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    .dot:nth-child(4) { animation-delay: 0.6s; }
    .dot:nth-child(5) { animation-delay: 0.8s; }
    @keyframes dotAnim {
      0%,80%,100% { background: rgba(88,101,242,0.25); transform: scale(1); }
      40% { background: #5865f2; transform: scale(1.4); box-shadow: 0 0 6px rgba(88,101,242,0.8); }
    }

    /* ── Status text ── */
    .status {
      font-size: 10px; color: #3a3f58;
      letter-spacing: 0.5px; text-transform: uppercase;
      min-height: 14px;
      animation: statusFade 0.4s ease;
    }
    @keyframes statusFade {
      from { opacity: 0; } to { opacity: 1; }
    }

    /* ── Version ── */
    .version {
      position: absolute; bottom: 14px;
      font-size: 10px; color: #252836;
      letter-spacing: 0.5px;
    }

    /* ── Corner accent lines ── */
    .corner {
      position: absolute;
      width: 24px; height: 24px;
      pointer-events: none;
      opacity: 0.35;
    }
    .corner-tl { top: 16px; left: 16px; border-top: 1px solid #5865f2; border-left: 1px solid #5865f2; }
    .corner-tr { top: 16px; right: 16px; border-top: 1px solid #5865f2; border-right: 1px solid #5865f2; }
    .corner-bl { bottom: 16px; left: 16px; border-bottom: 1px solid #9b59b6; border-left: 1px solid #9b59b6; }
    .corner-br { bottom: 16px; right: 16px; border-bottom: 1px solid #9b59b6; border-right: 1px solid #9b59b6; }
  </style>
</head>
<body>
  <canvas id="particles"></canvas>

  <!-- Corner decorations -->
  <div class="corner corner-tl"></div>
  <div class="corner corner-tr"></div>
  <div class="corner corner-bl"></div>
  <div class="corner corner-br"></div>

  <!-- Glow rings -->
  <div class="rings">
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="ring"></div>
  </div>
  <div class="glow-blob"></div>

  <!-- Main content -->
  <div class="content">
    <div class="logo-wrap">
      <div class="logo-bg"></div>
      <div class="logo-svg">
        <svg width="38" height="38" viewBox="0 0 24 24" fill="none">
          <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03z" fill="url(#splashG)"/>
          <defs>
            <linearGradient id="splashG" x1="0" y1="0" x2="24" y2="24">
              <stop offset="0%" stop-color="#5865f2"/>
              <stop offset="100%" stop-color="#9b59b6"/>
            </linearGradient>
          </defs>
        </svg>
      </div>
    </div>

    <h1>Discord Server Builder <span class="pro">Pro</span></h1>
    <div class="tagline">Building your workspace...</div>

    <div class="dots">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
    <div class="status" id="statusText">Initializing</div>
  </div>

  <div class="version">v1.0.0 Pro</div>

  <script>
    // ── Particle system ──────────────────────────────────
    const canvas = document.getElementById('particles');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    const COLORS = ['rgba(88,101,242,', 'rgba(155,89,182,', 'rgba(0,212,255,'];
    const particles = [];

    class Particle {
      constructor() { this.reset(true); }
      reset(initial = false) {
        this.x = Math.random() * canvas.width;
        this.y = initial ? Math.random() * canvas.height : canvas.height + 5;
        this.size = Math.random() * 1.8 + 0.4;
        this.speedY = -(Math.random() * 0.4 + 0.15);
        this.speedX = (Math.random() - 0.5) * 0.3;
        this.color = COLORS[Math.floor(Math.random() * COLORS.length)];
        this.alpha = Math.random() * 0.5 + 0.1;
        this.maxAlpha = this.alpha;
        this.life = 0;
        this.maxLife = Math.random() * 300 + 200;
      }
      update() {
        this.x += this.speedX;
        this.y += this.speedY;
        this.life++;
        const progress = this.life / this.maxLife;
        if (progress < 0.1) this.alpha = this.maxAlpha * (progress / 0.1);
        else if (progress > 0.8) this.alpha = this.maxAlpha * (1 - (progress - 0.8) / 0.2);
        else this.alpha = this.maxAlpha;
        if (this.life > this.maxLife || this.y < -5) this.reset();
      }
      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = this.color + this.alpha + ')';
        ctx.fill();
      }
    }

    for (let i = 0; i < 55; i++) particles.push(new Particle());

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => { p.update(); p.draw(); });
      requestAnimationFrame(animate);
    }
    animate();

    // ── Status text cycling ──────────────────────────────
    const statuses = ['Initializing', 'Loading modules', 'Connecting services', 'Almost ready'];
    let sIdx = 0;
    const statusEl = document.getElementById('statusText');
    setInterval(() => {
      sIdx = (sIdx + 1) % statuses.length;
      statusEl.style.animation = 'none';
      void statusEl.offsetWidth;
      statusEl.style.animation = 'statusFade 0.4s ease';
      statusEl.textContent = statuses[sIdx];
    }, 600);
  </script>
</body>
</html>
